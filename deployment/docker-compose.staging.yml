services:
  travelplanner:
    image: node:lts-bookworm
    working_dir: /app
    command: sh -c "npm install && node src/server.js"
    labels:
      - traefik.enable=true
      - traefik.http.routers.travelplanner-staging.rule=Host(`${STAGING_HOST:-staging.travelplanner.srv1553531.hstgr.cloud}`)
      - traefik.http.routers.travelplanner-staging.entrypoints=websecure
      - traefik.http.routers.travelplanner-staging.tls.certresolver=letsencrypt
      - traefik.http.services.travelplanner-staging.loadbalancer.server.port=3457
    volumes:
      - /docker/openclaw-fbdq/data/.openclaw/workspace-sherlock/projects/travelplanner-staging:/app
    env_file:
      - /docker/travelplanner/.env
    restart: unless-stopped
