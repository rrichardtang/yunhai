<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GuideMe — Profile Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <style>
    /* ============================================================
       PROFILE WIZARD
       Replaces the old shadcn-style wizard with the GuideMe language.
       Reuses identical step structure — name → questions → about-me.
       ============================================================ */

    html, body { height: 100%; }
    body { overflow: hidden; }

    /* ---------- Faux page behind the overlay ---------- */
    .stage {
      position: fixed; inset: 0;
      background: var(--paper-0);
      overflow: hidden;
    }
    .stage__topbar {
      height: 56px;
      background: var(--ink-900);
      color: var(--paper-0);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 18px;
      border-bottom: 1px solid var(--ink-700);
    }
    .stage__topbar .nm {
      font-weight: 600;
      letter-spacing: -0.025em;
      font-size: 16.5px;
    }
    .stage__topbar .nm .me {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      margin-left: 1px;
      font-size: 1.05em;
      color: var(--paper-0);
    }
    .stage__topbar .sub {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: rgba(244,241,236,.55);
      text-transform: uppercase;
    }
    .stage__page {
      padding: 36px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .stage__block {
      background: var(--paper-1);
      border: 1px solid var(--hair);
      border-radius: var(--r-lg);
      height: 140px;
      box-shadow: var(--sh-sm);
    }
    .stage__block.tall { height: 240px; }
    .stage__block.wide { grid-column: span 2; }
    /* Make the faux page feel like there's content without distracting */
    .stage::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 0, rgba(244,241,236,.6) 80%);
    }

    /* ---------- Overlay scrim ---------- */
    .wiz-overlay {
      position: fixed; inset: 0;
      background: rgba(7, 11, 18, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      animation: wizFade 280ms var(--ease-out);
    }
    @keyframes wizFade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ---------- Shell ---------- */
    .wiz {
      width: 100%;
      max-width: 560px;
      background: var(--paper-1);
      border-radius: var(--r-xl);
      box-shadow: var(--sh-lg);
      border: 1px solid var(--hair);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      animation: wizRise 360ms var(--ease-out) both;
    }
    @keyframes wizRise {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ---------- Header ---------- */
    .wiz__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
      gap: 12px;
    }
    .wiz__counter {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-500);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .wiz__counter .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,125,251,.16);
    }
    .wiz__counter .step {
      color: var(--text-900);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .wiz__counter .sep {
      color: var(--text-400);
      margin: 0 -2px;
    }
    .wiz__counter .total {
      color: var(--text-500);
      font-variant-numeric: tabular-nums;
    }

    .wiz__close {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid var(--hair);
      color: var(--text-500);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
    }
    .wiz__close:hover {
      background: var(--paper-2);
      color: var(--text-900);
      border-color: var(--hair-strong);
    }
    .wiz__close i { font-size: 11px; line-height: 1; }

    /* ---------- Progress ---------- */
    .wiz__progress-wrap {
      padding: 14px 24px 0;
    }
    .wiz__progress {
      height: 2px;
      background: var(--hair);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .wiz__progress::after {
      content: '';
      display: block;
      height: 100%;
      width: var(--pct, 0%);
      background: var(--ink-900);
      border-radius: 999px;
      transition: width 480ms var(--ease-out);
    }

    /* Pip ladder under the bar — 9 ticks; current one highlights */
    .wiz__pips {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .wiz__pip {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--paper-2);
      border: 1px solid var(--hair);
      transition: all var(--dur-med) var(--ease-out);
    }
    .wiz__pip.done {
      background: var(--ink-900);
      border-color: var(--ink-900);
    }
    .wiz__pip.now {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,125,251,.14);
    }

    /* ---------- Body ---------- */
    .wiz__body {
      padding: 26px 36px 28px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }
    .wiz__eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-500);
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .wiz__eyebrow .key {
      color: var(--accent-deep);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.1em;
    }
    .wiz__title {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--text-900);
      line-height: 1.12;
      margin-bottom: 8px;
      max-width: 460px;
    }
    .wiz__title .serif {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .wiz__sub {
      font-size: 13.5px;
      color: var(--text-500);
      line-height: 1.55;
      letter-spacing: -0.005em;
      margin-bottom: 24px;
      max-width: 440px;
    }

    .wiz__content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ---------- Text input (name + free-text + about-me) ---------- */
    .wiz-text {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-900);
      padding: 6px 0 10px;
      border-bottom: 1px solid var(--hair-strong);
      transition: border-color var(--dur-fast);
    }
    .wiz-text::placeholder { color: var(--text-400); font-weight: 400; }
    .wiz-text:focus { border-bottom-color: var(--ink-900); }

    .wiz-text--counter {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-400);
      display: flex;
      justify-content: space-between;
    }

    .wiz-textarea-wrap {
      background: var(--paper-0);
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
      padding: 14px 16px;
      transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
    }
    .wiz-textarea-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,125,251,.12);
    }
    .wiz-textarea {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      resize: vertical;
      min-height: 120px;
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--text-900);
      letter-spacing: -0.005em;
    }
    .wiz-textarea::placeholder { color: var(--text-400); }

    /* ---------- Dot scale (1–5) ---------- */
    .wiz-scale {
      margin-top: 4px;
    }
    .wiz-scale__display {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .wiz-scale__value {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 400;
      font-size: 38px;
      letter-spacing: -0.015em;
      color: var(--text-900);
      line-height: 1;
      transition: opacity var(--dur-fast);
    }
    .wiz-scale__index {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-500);
      font-variant-numeric: tabular-nums;
    }
    .wiz-scale__index b {
      color: var(--text-900);
      font-weight: 500;
    }

    .wiz-scale__track {
      position: relative;
      height: 56px;
      padding: 0 12px;
    }
    .wiz-scale__rail {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 1px;
      background: var(--hair-strong);
      transform: translateY(-50%);
    }
    .wiz-scale__fill {
      position: absolute;
      top: 50%;
      left: 12px;
      height: 2px;
      background: var(--ink-900);
      border-radius: 999px;
      transform: translateY(-50%);
      transition: width 320ms var(--ease-out);
    }
    .wiz-scale__dots {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }
    .wiz-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--paper-1);
      border: 1.5px solid var(--hair-strong);
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      position: relative;
      z-index: 2;
    }
    .wiz-dot:hover {
      border-color: var(--text-900);
      transform: scale(1.08);
    }
    .wiz-dot.done {
      background: var(--ink-900);
      border-color: var(--ink-900);
    }
    .wiz-dot.now {
      width: 22px;
      height: 22px;
      background: var(--paper-1);
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 4px rgba(47,125,251,.16), 0 2px 6px rgba(47,125,251,.18);
    }
    .wiz-dot.now::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .wiz-scale__ends {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-500);
    }
    .wiz-scale__ends .right { text-align: right; }

    /* ---------- Footer ---------- */
    .wiz__foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--hair);
      background: var(--paper-1);
    }
    .wiz__foot-hint {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-400);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .wiz__foot-hint kbd {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      background: var(--paper-2);
      border: 1px solid var(--hair);
      border-radius: 4px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--text-700);
    }

    .wiz-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 18px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease-out);
      border: 1px solid transparent;
    }
    .wiz-btn--ghost {
      background: transparent;
      color: var(--text-700);
      border-color: var(--hair-strong);
    }
    .wiz-btn--ghost:hover {
      background: var(--paper-2);
      color: var(--text-900);
      border-color: var(--text-900);
    }
    .wiz-btn--primary {
      background: var(--ink-900);
      color: var(--paper-0);
    }
    .wiz-btn--primary:hover { background: var(--ink-800); box-shadow: var(--sh-md); }
    .wiz-btn--primary:active { transform: translateY(1px); }
    .wiz-btn .icon { font-size: 11px; }

    .wiz-btn[disabled] { opacity: .35; cursor: not-allowed; }

    /* ---------- Why we ask: subtle aside ---------- */
    .wiz__aside {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      background: var(--paper-2);
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
    }
    .wiz__aside-key {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-500);
      flex-shrink: 0;
      padding-top: 1px;
    }
    .wiz__aside-text {
      font-size: 12.5px;
      color: var(--text-700);
      line-height: 1.5;
      letter-spacing: -0.005em;
    }

    /* ---------- Finish (last) state: success-y nudge ---------- */
    .wiz__title .accent {
      color: var(--accent-deep);
    }

    /* Tweak the body fade between steps */
    .wiz__body.is-leaving .wiz__content,
    .wiz__body.is-leaving .wiz__eyebrow,
    .wiz__body.is-leaving .wiz__title,
    .wiz__body.is-leaving .wiz__sub,
    .wiz__body.is-leaving .wiz__aside {
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 140ms var(--ease-out), transform 140ms var(--ease-out);
    }
    .wiz__body .wiz__content,
    .wiz__body .wiz__eyebrow,
    .wiz__body .wiz__title,
    .wiz__body .wiz__sub,
    .wiz__body .wiz__aside {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 280ms var(--ease-out), transform 280ms var(--ease-out);
    }

    /* Mobile */
    @media (max-width: 640px) {
      .wiz { border-radius: var(--r-lg); }
      .wiz__body { padding: 22px 22px 24px; min-height: 320px; }
      .wiz__title { font-size: 23px; }
      .wiz-scale__value { font-size: 30px; }
      .stage__page { display: none; }
    }
  </style>
</head>
<body>

  <!-- ============ Faux planner page behind the overlay ============ -->
  <div class="stage" aria-hidden="true">
    <div class="stage__topbar">
      <span class="nm">Guide<span class="me">me</span></span>
      <span class="sub">Personal AI itinerary builder</span>
    </div>
    <div class="stage__page">
      <div class="stage__block tall wide"></div>
      <div class="stage__block tall"></div>
      <div class="stage__block"></div>
      <div class="stage__block"></div>
      <div class="stage__block"></div>
      <div class="stage__block wide"></div>
      <div class="stage__block"></div>
    </div>
  </div>

  <!-- ============ Wizard overlay ============ -->
  <div class="wiz-overlay" role="dialog" aria-modal="true" aria-label="Create Profile">
    <div class="wiz" id="wiz">
      <!-- Header -->
      <div class="wiz__head">
        <span class="wiz__counter">
          <span class="dot" aria-hidden="true"></span>
          <span>Step</span>
          <span class="step" id="wizStep">01</span>
          <span class="sep">/</span>
          <span class="total" id="wizTotal">09</span>
        </span>
        <button class="wiz__close" type="button" aria-label="Cancel"><i class="ph-bold ph-x"></i></button>
      </div>

      <!-- Progress -->
      <div class="wiz__progress-wrap">
        <div class="wiz__progress" id="wizProgress" style="--pct: 11%;"></div>
        <div class="wiz__pips" id="wizPips"></div>
      </div>

      <!-- Body — rendered by JS -->
      <div class="wiz__body" id="wizBody"></div>

      <!-- Footer -->
      <div class="wiz__foot">
        <button class="wiz-btn wiz-btn--ghost" id="wizBack" type="button">
          <i class="ph-bold ph-arrow-left icon"></i>
          Back
        </button>
        <span class="wiz__foot-hint">
          <kbd>↵</kbd>
          <span id="wizHint">to continue</span>
        </span>
        <button class="wiz-btn wiz-btn--primary" id="wizNext" type="button">
          <span id="wizNextLabel">Next</span>
          <i class="ph-bold ph-arrow-right icon"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ Wizard logic ============ -->
  <script>
    /* Mirrors the existing app's profile wizard structure 1:1:
       PROFILE_QUESTIONS is the inner question list; the wizard wraps
       it with a name step at index 0 and an aboutMe step at the end.
       totalSteps = PROFILE_QUESTIONS.length + 2 */

    const PROFILE_DEFAULT = 3;

    /* Scale labels: generic (profileLabel) is used for every dot-scale question
       except `pace`, which uses its own (pacePrefLabel). Source of truth:
       public/js/profileWizard.js */
    const GENERIC_LABELS = ['Not interested at all', 'Slightly interested', 'Neutral', 'Very interested', 'Love this'];
    const PACE_LABELS    = ['Very relaxed', 'Easy-going', 'Moderate', 'Active', 'Non-stop'];

    /* PROFILE_QUESTIONS — 1:1 from public/js/profileWizard.js
       Augmented with `tag`, `display`, `sub`, `ends`, `why` for richer mock UI.
       The `key`, `label`, and `type` fields match the production array. */
    const PROFILE_QUESTIONS = [
      {
        key: 'museumPerson',
        label: 'Are you a museum person?',
        tag: 'Museums',
        display: 'Are you a <span class="serif">museum</span> person?',
        sub: 'Galleries, history, archaeology, design. We use this to weight cultural stops.',
        ends: ['Not for me', 'Love it'],
        why: 'Drives how often we surface museums, ruins, and gallery shows.'
      },
      {
        key: 'foodTravel',
        label: 'Do you travel for food?',
        tag: 'Food',
        display: 'Do you travel <span class="serif">for food</span>?',
        sub: 'From plate-by-plate market crawls to bookings made three months out.',
        ends: ['Just fuel', 'Live for it'],
        why: 'Decides how many meal slots we flag for booking and how special they are.'
      },
      {
        key: 'livePerformances',
        label: 'Do you enjoy live performances?',
        tag: 'Performance',
        display: 'Do you enjoy <span class="serif">live performances</span>?',
        sub: 'Concerts, flamenco, opera, comedy clubs, street theatre — anything ticketed and timed.',
        ends: ['Not for me', 'Love it'],
        why: 'Surfaces ticketed evening events that fit your dates.'
      },
      {
        key: 'outdoorNature',
        label: 'Do you enjoy outdoor / nature activities?',
        tag: 'Outdoors',
        display: 'Do you enjoy <span class="serif">outdoor</span> activities?',
        sub: 'Hikes, gardens, beach days, day trips into the countryside.',
        ends: ['Indoor type', 'Love it'],
        why: 'Balances city days with green / off-grid time.'
      },
      {
        key: 'nightlifeBars',
        label: 'Are you into nightlife and bars?',
        tag: 'Nightlife',
        display: 'Are you into <span class="serif">nightlife</span> and bars?',
        sub: 'Late dinners, wine bars, dance floors, last metro. Or pyjamas by 10.',
        ends: ['Early to bed', 'Love it'],
        why: 'Stretches the day-end window and suggests evening neighborhoods.'
      },
      {
        key: 'structuredTours',
        label: 'Do you like guided tours?',
        tag: 'Tours',
        display: 'Do you like <span class="serif">guided</span> tours?',
        sub: 'Hosted, scheduled, with a story. Or roll-your-own with a paper map.',
        ends: ['Self-guided', 'Love it'],
        why: 'Toggles GetYourGuide / Viator picks vs DIY routes.'
      },
      {
        key: 'shoppingPerson',
        label: 'Do you enjoy shopping while traveling?',
        tag: 'Shopping',
        display: 'Do you enjoy <span class="serif">shopping</span> while traveling?',
        sub: 'Browsing markets, hunting boutiques, finding the one thing you can\'t get at home.',
        ends: ['Skip it', 'Love it'],
        why: 'Adds shop / market stops to the right neighborhoods at the right time.'
      },
      {
        key: 'pace',
        label: 'How packed do you like your days?',
        tag: 'Pace',
        display: 'How <span class="serif">packed</span> do you like your days?',
        sub: 'Sets default day length. You can override day-by-day in Arrange later.',
        ends: ['Very relaxed', 'Non-stop'],
        why: 'Caps total activity hours per day and bakes in buffer time.'
      },
      {
        key: 'dayStructure',
        label: 'How do you like your days structured?',
        tag: 'Structure',
        type: 'text',
        display: 'How do you like your days <span class="serif">structured</span>?',
        sub: 'Hours you’re up and out, when you wind down, what kind of rhythm feels right.',
        placeholder: 'e.g. I like to start early and wrap up by 9pm',
        why: 'Sets your day-start / day-end window so we don\'t schedule a 9am church tour after midnight tapas.'
      },
      {
        key: 'dietaryRestrictions',
        label: 'Do you have any dietary restrictions or food preferences?',
        tag: 'Diet',
        type: 'text',
        display: 'Any <span class="serif">dietary</span> notes or restrictions?',
        sub: 'Allergies, intolerances, religious, ethical, strong likes / dislikes. Anything we should filter for.',
        placeholder: 'e.g. I’m vegetarian and avoid shellfish',
        why: 'Filters every meal recommendation and flags non-flexible cuisines.'
      },
      {
        key: 'mobilityConsiderations',
        label: 'Any mobility or physical considerations we should know about?',
        tag: 'Mobility',
        type: 'text',
        display: 'Any <span class="serif">mobility</span> considerations?',
        sub: 'Stairs, distances, surfaces, fatigue. Anything that should shape the day.',
        placeholder: 'e.g. I avoid lots of walking or stairs',
        why: 'Caps walking distance per day and prioritises elevator-accessible stops.'
      },
      {
        key: 'budgetStyle',
        label: 'How would you describe your spending style while traveling?',
        tag: 'Budget',
        type: 'text',
        display: 'How do you <span class="serif">spend</span> when traveling?',
        sub: 'Not your trip budget — your relative comfort. Where do you save, where do you splurge?',
        placeholder: 'e.g. I prefer mid-range, splurge on food but save on activities',
        why: 'Weights recommendations and decides how aggressively the Optimize tool can move things.'
      },
      {
        key: 'travelCompanions',
        label: 'Who are you typically traveling with?',
        tag: 'Companions',
        type: 'text',
        display: 'Who are you typically <span class="serif">traveling with</span>?',
        sub: 'Solo, partner, kids, parents, friend group. Names and ages help if relevant.',
        placeholder: 'e.g. My partner and two kids aged 8 and 11',
        why: 'Adapts pacing, accommodation type, and activity intensity to the party.'
      },
      {
        key: 'shoppingInterests',
        label: 'What do you like to shop for while traveling?',
        tag: 'Interests',
        type: 'text',
        display: 'What do you like to <span class="serif">shop for</span>?',
        sub: 'Optional — only matters if you said yes to shopping a few steps back.',
        placeholder: 'e.g. fragrance, fashion, vinyl, vintage, food souvenirs',
        why: 'Routes you past the right boutiques, markets, and concept stores.'
      }
    ];

    /* Step 0 = profile name. Steps 1..N = PROFILE_QUESTIONS.
       Step N+1 = about-me. */
    const TOTAL = PROFILE_QUESTIONS.length + 2;
    const ABOUT_INDEX = TOTAL - 1;

    const state = {
      stepIndex: 0,
      name: 'My Profile',
      answers: Object.fromEntries(
        PROFILE_QUESTIONS.map(q => [q.key, q.type === 'text' ? '' : PROFILE_DEFAULT])
      ),
      aboutMe: ''
    };

    const els = {
      body: document.getElementById('wizBody'),
      back: document.getElementById('wizBack'),
      next: document.getElementById('wizNext'),
      nextLabel: document.getElementById('wizNextLabel'),
      step: document.getElementById('wizStep'),
      total: document.getElementById('wizTotal'),
      progress: document.getElementById('wizProgress'),
      pips: document.getElementById('wizPips'),
      hint: document.getElementById('wizHint')
    };

    function pad(n) { return String(n).padStart(2, '0'); }

    function renderPips() {
      els.pips.innerHTML = Array.from({ length: TOTAL }, (_, i) => {
        let cls = '';
        if (i < state.stepIndex) cls = 'done';
        else if (i === state.stepIndex) cls = 'now';
        return `<span class="wiz__pip ${cls}"></span>`;
      }).join('');
    }

    function renderHeader() {
      els.step.textContent = pad(state.stepIndex + 1);
      els.total.textContent = pad(TOTAL);
      const pct = Math.max(6, Math.round(((state.stepIndex + 1) / TOTAL) * 100));
      els.progress.style.setProperty('--pct', pct + '%');
      renderPips();

      els.back.style.visibility = state.stepIndex === 0 ? 'hidden' : 'visible';
      const isFinish = state.stepIndex === ABOUT_INDEX;
      els.nextLabel.textContent = isFinish ? 'Finish' : 'Next';
      els.hint.textContent = isFinish ? 'to finish' : 'to continue';
      els.next.querySelector('.icon').className = isFinish
        ? 'ph-bold ph-check icon'
        : 'ph-bold ph-arrow-right icon';
    }

    function renderBody() {
      const i = state.stepIndex;
      let eyebrow, title, sub, contentHtml, asideText, asideKey = 'WHY WE ASK';

      if (i === 0) {
        eyebrow = `<span class="key">Step ${pad(i + 1)}</span> Name`;
        title = `What should we <span class="serif">call</span> this profile?`;
        sub = `You can keep multiple — “Solo Europe”, “Kids in tow”, “Romantic weekends”. Switch between them anytime.`;
        contentHtml = `
          <input class="wiz-text" id="wizNameInput" type="text"
            maxlength="32" autocomplete="off" spellcheck="false"
            value="${escapeAttr(state.name)}" placeholder="My Profile" />
          <div class="wiz-text--counter">
            <span>Press <kbd style="font-family:inherit;background:var(--paper-2);border:1px solid var(--hair);border-radius:3px;padding:1px 4px;">Tab</kbd> to advance</span>
            <span><span id="wizNameLen">${state.name.length}</span> / 32</span>
          </div>
        `;
        asideText = `Profiles store your travel style so we don’t ask twice. We never share them.`;
      } else if (i === ABOUT_INDEX) {
        eyebrow = `<span class="key">Step ${pad(i + 1)}</span> Anything else?`;
        title = `Anything else we <span class="serif">might have missed</span>?`;
        sub = `Free text. Quirks, constraints, life context. The planner will read it like a friend would.`;
        contentHtml = `
          <div class="wiz-textarea-wrap">
            <textarea class="wiz-textarea" id="wizAbout"
              placeholder="e.g. I’m not a morning person. Smaller budget. Avoid anything with lots of walking. Travelling with my mum who needs an elevator."
            >${escapeText(state.aboutMe)}</textarea>
          </div>
        `;
        asideText = `Anything you write here is weighted heavily. If something’s a deal-breaker, say so.`;
      } else {
        const q = PROFILE_QUESTIONS[i - 1];
        eyebrow = `<span class="key">Step ${pad(i + 1)}</span> ${q.tag}`;
        title = q.display;
        sub = q.sub;
        if (q.type === 'text') {
          contentHtml = `
            <div class="wiz-textarea-wrap">
              <textarea class="wiz-textarea" id="wizFreeText" placeholder="${escapeAttr(q.placeholder || '')}"
                >${escapeText(state.answers[q.key] || '')}</textarea>
            </div>
          `;
        } else {
          const value = Number(state.answers[q.key]) || PROFILE_DEFAULT;
          contentHtml = renderScale(q.key, value, q.ends);
        }
        asideText = q.why;
      }

      els.body.innerHTML = `
        <div class="wiz__eyebrow">${eyebrow}</div>
        <h2 class="wiz__title">${title}</h2>
        <p class="wiz__sub">${sub}</p>
        <div class="wiz__content">${contentHtml}</div>
        <div class="wiz__aside">
          <span class="wiz__aside-key">${asideKey}</span>
          <span class="wiz__aside-text">${asideText}</span>
        </div>
      `;

      bindBody();
    }

    function scaleLabelsFor(key) {
      return key === 'pace' ? PACE_LABELS : GENERIC_LABELS;
    }

    function renderScale(key, value, ends) {
      const labels = scaleLabelsFor(key);
      const fillPct = ((value - 1) / 4) * 100;
      const dots = Array.from({ length: 5 }, (_, idx) => {
        const v = idx + 1;
        let cls = '';
        if (v < value) cls = 'done';
        else if (v === value) cls = 'now';
        return `<button type="button" class="wiz-dot ${cls}" data-v="${v}" aria-label="${v} of 5"></button>`;
      }).join('');
      return `
        <div class="wiz-scale" data-key="${key}">
          <div class="wiz-scale__display">
            <span class="wiz-scale__value" id="wizScaleLabel">${labels[value - 1] || ''}</span>
            <span class="wiz-scale__index"><b id="wizScaleNum">${value}</b> of 5</span>
          </div>
          <div class="wiz-scale__track">
            <div class="wiz-scale__rail"></div>
            <div class="wiz-scale__fill" id="wizScaleFill" style="width: calc(${fillPct}% - 0px);"></div>
            <div class="wiz-scale__dots">${dots}</div>
          </div>
          <div class="wiz-scale__ends">
            <span class="left">${ends[0]}</span>
            <span class="right">${ends[1]}</span>
          </div>
        </div>
      `;
    }

    function bindBody() {
      // Name input
      const nameInput = document.getElementById('wizNameInput');
      if (nameInput) {
        nameInput.focus();
        nameInput.select();
        nameInput.addEventListener('input', () => {
          state.name = nameInput.value;
          const lenEl = document.getElementById('wizNameLen');
          if (lenEl) lenEl.textContent = nameInput.value.length;
        });
      }

      // About-me / free-text textareas
      const about = document.getElementById('wizAbout');
      if (about) {
        about.focus();
        about.addEventListener('input', () => { state.aboutMe = about.value; });
      }

      const free = document.getElementById('wizFreeText');
      if (free) {
        free.focus();
        const q = PROFILE_QUESTIONS[state.stepIndex - 1];
        free.addEventListener('input', () => { state.answers[q.key] = free.value; });
      }

      // Dot scale
      const scale = document.querySelector('.wiz-scale');
      if (scale) {
        const key = scale.dataset.key;
        const labels = scaleLabelsFor(key);
        scale.querySelectorAll('.wiz-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            const v = Number(dot.dataset.v);
            state.answers[key] = v;
            // update dots
            scale.querySelectorAll('.wiz-dot').forEach((d, idx) => {
              const dv = idx + 1;
              d.classList.toggle('done', dv < v);
              d.classList.toggle('now', dv === v);
            });
            // update fill, value label, index
            const fill = document.getElementById('wizScaleFill');
            const lbl  = document.getElementById('wizScaleLabel');
            const num  = document.getElementById('wizScaleNum');
            if (fill) fill.style.width = ((v - 1) / 4) * 100 + '%';
            if (lbl)  lbl.textContent = labels[v - 1] || '';
            if (num)  num.textContent = v;
          });
        });
      }
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escapeText(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function goTo(idx) {
      const body = document.getElementById('wizBody');
      body.classList.add('is-leaving');
      setTimeout(() => {
        state.stepIndex = Math.max(0, Math.min(TOTAL - 1, idx));
        renderHeader();
        renderBody();
        requestAnimationFrame(() => body.classList.remove('is-leaving'));
      }, 140);
    }

    els.back.addEventListener('click', () => goTo(state.stepIndex - 1));
    els.next.addEventListener('click', () => {
      if (state.stepIndex === ABOUT_INDEX) {
        // "Finish" — flash the button and stay (mock)
        els.next.style.background = 'var(--ok)';
        els.next.querySelector('span').textContent = 'Done';
        return;
      }
      goTo(state.stepIndex + 1);
    });

    // Enter advances, Shift+Enter inserts newline (in textareas), Esc closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        const t = e.target;
        if (t && t.tagName === 'TEXTAREA') return; // don't trap newline-only
        e.preventDefault();
        els.next.click();
      } else if (e.key === 'ArrowLeft' && state.stepIndex > 0 && (!e.target || e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
        els.back.click();
      } else if (e.key === 'ArrowRight' && (!e.target || e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
        els.next.click();
      }
    });

    // Init
    els.total.textContent = pad(TOTAL);
    renderHeader();
    renderBody();
  </script>
</body>
</html>
