<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading modal preview</title>
<style>
  :root{ --text-on-dark:#F5F0EB; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(135deg,#26405f,#162a44);display:flex;align-items:center;justify-content:center}

  .planning-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
    background:rgba(11,37,69,.62);backdrop-filter:blur(8px)}
  .planning-overlay-card{position:relative;width:min(440px,100%);padding:6px 36px 40px;text-align:center;color:var(--text-on-dark);
    background:radial-gradient(120% 80% at 50% -12%, rgba(42,125,225,.30), transparent 60%),linear-gradient(160deg,#103a72 0%,#0b2545 56%,#081b34 100%);
    border:1px solid rgba(245,240,235,.08);border-radius:28px;
    box-shadow:0 30px 80px rgba(8,20,40,.55), inset 0 1px 0 rgba(245,240,235,.06);overflow:hidden;
    animation:planningCardIn .5s cubic-bezier(.2,.8,.2,1) both}
  .planning-globe{width:220px;max-width:100%;margin:4px auto -4px}
  .globe-svg{width:100%;height:auto;display:block;animation:globeFloat 5s ease-in-out infinite}
  .orbit-route{animation:routeFlow 1.1s linear infinite}
  .planning-globe .plane{offset-path:path('M196,78 A86,24 0 1,1 24,78 A86,24 0 1,1 196,78');offset-rotate:auto;
    animation:planeOrbit 6s linear infinite, planeFade 6s linear infinite}
  .planning-trip{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,240,235,.6);margin-bottom:14px}
  .planning-status{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;color:var(--text-on-dark);margin-bottom:14px}
  .planning-progress{display:inline-block;font-size:.8rem;font-weight:600;letter-spacing:.02em;color:rgba(245,240,235,.78);
    background:rgba(245,240,235,.08);border:1px solid rgba(245,240,235,.1);padding:5px 14px;border-radius:999px;margin-bottom:18px}
  .planning-message{font-size:1.05rem;font-weight:600;color:#6db0ff;min-height:1.4em;
    opacity:1;transition:opacity .45s ease, transform .45s ease}
  @keyframes globeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes routeFlow{to{stroke-dashoffset:-8}}
  @keyframes planeOrbit{to{offset-distance:100%}}
  @keyframes planeFade{0%,46%{opacity:1}56%,82%{opacity:.18}92%,100%{opacity:1}}
  @keyframes planningCardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.globe-svg,.orbit-route,.planning-overlay-card,.planning-globe .plane{animation:none!important}}
</style>
</head>
<body>
<div class="planning-overlay">
  <div class="planning-overlay-card">
    <div class="planning-globe" aria-hidden="true">
      <svg viewBox="0 0 220 150" class="globe-svg" role="presentation" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="pgOcean" cx="38%" cy="30%" r="82%">
            <stop offset="0%" stop-color="#5aa2f2"/><stop offset="52%" stop-color="#1c5fae"/><stop offset="100%" stop-color="#0b2c58"/>
          </radialGradient>
          <radialGradient id="pgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(42,125,225,.55)"/><stop offset="100%" stop-color="rgba(42,125,225,0)"/>
          </radialGradient>
          <clipPath id="pgClip"><circle cx="110" cy="78" r="52"/></clipPath>
        </defs>
        <circle cx="110" cy="78" r="72" fill="url(#pgGlow)"/>
        <circle cx="110" cy="78" r="52" fill="url(#pgOcean)"/>
        <g clip-path="url(#pgClip)" fill="none" stroke="rgba(245,240,235,.22)" stroke-width="1">
          <ellipse cx="110" cy="78" rx="18" ry="52"/><ellipse cx="110" cy="78" rx="38" ry="52"/>
          <line x1="110" y1="26" x2="110" y2="130"/>
          <ellipse cx="110" cy="78" rx="52" ry="20"/><ellipse cx="110" cy="78" rx="52" ry="40"/>
          <line x1="58" y1="78" x2="162" y2="78"/>
        </g>
        <ellipse cx="92" cy="56" rx="19" ry="11" fill="rgba(245,240,235,.16)" transform="rotate(-30 92 56)"/>
        <g transform="rotate(-13 110 78)">
          <path d="M196,78 A86,24 0 1,1 24,78 A86,24 0 1,1 196,78" fill="none" stroke="rgba(109,176,255,.6)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" class="orbit-route"/>
          <g class="plane">
            <path d="M12,0 L-7,-7 L-2,-2 L-12,-2 L-9,0 L-12,2 L-2,2 L-7,7 Z" fill="#F7F3EE" stroke="#0b2c58" stroke-width=".6" stroke-linejoin="round"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="planning-trip" data-trip-name>Planning your trip to Japan</div>
    <div class="planning-status" data-city-status>Planning Tokyo, Japan&hellip;</div>
    <div class="planning-progress" data-progress>City 0 of 1 done</div>
    <div class="planning-message" data-loading-message>Checking sunset times&hellip;</div>
  </div>
</div>
<script>
  // Cycle the rotating status line, mirroring the real app's behaviour
  const MSGS=['Checking sunset times…','Finding the best neighbourhoods to get lost in…',
    'Filtering out the boring stuff…','Pencilling in coffee stops…','Reading the room for rainy days…'];
  let i=0;const el=document.querySelector('[data-loading-message]');
  setInterval(()=>{el.style.opacity='0';el.style.transform='translateY(6px)';
    setTimeout(()=>{i=(i+1)%MSGS.length;el.textContent=MSGS[i];el.style.opacity='1';el.style.transform='translateY(0)';},250);},2400);
</script>
</body>
</html>
